name: JARVIS local-first checks

on:
  pull_request:
    branches: ["feat/jarvis-foundation", "main"]
  push:
    branches: ["feat/independent-local-learning-core", "feat/jarvis-foundation"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Syntax checks and integration tests
        run: npm run check
