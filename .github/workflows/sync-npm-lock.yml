name: Sync npm lockfile

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
    paths:
      - package.json
      - .github/workflows/sync-npm-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-npm-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    name: Regenerate and verify package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit the updated lockfile when needed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "package-lock.json is already in sync."
          fi

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run syntax checks and tests
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
