name: JARVIS Android Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

concurrency:
  group: jarvis-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build and verify signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Validate protected signing secrets
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Decode the signing keystore into the ephemeral runner
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/jarvis-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          test -s "$key_path"
          chmod 600 "$key_path"
          echo "ANDROID_SIGNING_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build release APK and run Android unit tests
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/jarvis-release.jks
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle -p android --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Verify release signature and publish checksums
        shell: bash
        run: |
          set -euo pipefail
          apk_path="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk_path"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::Android SDK root was not provided by the runner."
            exit 1
          fi
          apksigner_path="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::Android build-tools apksigner was not found."
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs "$apk_path"
          unzip -t "$apk_path" >/dev/null
          mkdir -p release-artifacts
          cp "$apk_path" "release-artifacts/JARVIS-Android-${GITHUB_REF_NAME}.apk"
          (
            cd release-artifacts
            sha256sum *.apk > SHA256SUMS.txt
          )
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "build_variant=release"
            echo "app_version=0.8.2-release-candidate"
          } > release-artifacts/build-info.txt

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/jarvis-release.jks"

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-android-signed-release
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14
