name: JARVIS CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-lockfile-bootstrap:
    name: Commit npm lockfile on Phase 11 branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/phase11-release-gates' && github.actor == '18110priyanshuraj-creator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out Phase 11 branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase11-release-gates

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate npm lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if missing or changed
        shell: bash
        run: |
          set -euo pipefail
          # A newly generated lockfile is untracked, so git diff alone will miss it.
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && git diff --quiet -- package-lock.json; then
            echo "The npm lockfile is already tracked and current."
            exit 0
          fi
          git add package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo "No lockfile change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: commit npm dependency lockfile"
          git push origin HEAD:feat/phase11-release-gates

  node-quality:
    name: Node.js tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Generate temporary dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install from generated lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run syntax checks and test suite
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload dependency lock bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-npm-lock-bootstrap
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

  android-build:
    name: Android Companion build and APK verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.14.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.6"

      - name: Build Android Companion
        run: gradle -p android --no-daemon --stacktrace assembleDebug

      - name: Verify APK and generate release metadata
        shell: bash
        run: |
          set -euo pipefail
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk_path"
          unzip -t "$apk_path" >/dev/null
          mkdir -p release-artifacts
          cp "$apk_path" release-artifacts/JARVIS-Companion-debug.apk
          (
            cd release-artifacts
            sha256sum JARVIS-Companion-debug.apk > JARVIS-Companion-debug.apk.sha256
          )
          {
            echo "commit=$GITHUB_SHA"
            echo "branch=$GITHUB_REF_NAME"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "build_variant=debug"
          } > release-artifacts/build-info.txt

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-companion-debug
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7
