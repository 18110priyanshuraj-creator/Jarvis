name: JARVIS CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feat/**"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-quality:
    name: Node.js tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run syntax checks and test suite
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  android-build:
    name: Android Companion build and APK verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.14.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build Android Companion
        run: gradle -p android --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - name: Verify APK and generate release metadata
        shell: bash
        run: |
          set -euo pipefail
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          release_apk_path="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          test -s "$apk_path"
          test -n "$release_apk_path"
          test -s "$release_apk_path"
          unzip -t "$apk_path" >/dev/null
          unzip -t "$release_apk_path" >/dev/null
          mkdir -p release-artifacts
          cp "$apk_path" release-artifacts/JARVIS-Companion-debug.apk
          (
            cd release-artifacts
            sha256sum JARVIS-Companion-debug.apk > JARVIS-Companion-debug.apk.sha256
          )
          {
            echo "commit=$GITHUB_SHA"
            echo "branch=$GITHUB_REF_NAME"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "build_variant=debug"
          } > release-artifacts/build-info.txt

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-companion-debug
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7
