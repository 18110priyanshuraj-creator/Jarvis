name: JARVIS checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax and tests
        run: npm run check

  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.14.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.6"
      - name: Build Android Companion
        run: gradle -p android --no-daemon assembleDebug

      - name: Verify APK and generate release metadata
        shell: bash
        run: |
          set -euo pipefail
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk_path"
          unzip -t "$apk_path" >/dev/null
          mkdir -p release-artifacts
          cp "$apk_path" release-artifacts/JARVIS-Companion-debug.apk
          sha256sum release-artifacts/JARVIS-Companion-debug.apk > release-artifacts/JARVIS-Companion-debug.apk.sha256
          {
            printf 'commit=%s\\n' "$GITHUB_SHA"
            printf 'branch=%s\\n' "$GITHUB_REF_NAME"
            printf 'workflow_run_id=%s\\n' "$GITHUB_RUN_ID"
            printf 'build_variant=debug\\n'
          } > release-artifacts/build-info.txt

      - name: Upload debug APK and verification files
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-companion-debug
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7
