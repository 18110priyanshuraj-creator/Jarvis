services:
  - type: web
    name: jarvis-assistant
    runtime: node
    plan: free
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JARVIS_PASSWORD
        sync: false
      - key: JARVIS_AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: JARVIS_AI_MODEL
        value: gemini-3.8-flash
      - key: JARVIS_AI_RUNTIME
        value: external
      - key: JARVIS_AI_ENABLED
        value: "true"
      - key: JARVIS_AI_CHAT_ENABLED
        value: "true"
      - key: JARVIS_AI_PLANNER_ENABLED
        value: "true"
      - key: JARVIS_AI_RETRY_ATTEMPTS
        value: "2"
      - key: JARVIS_GEMINI_API_KEY_1
        sync: false
      - key: JARVIS_GEMINI_API_KEY_2
        sync: false
      - key: JARVIS_GEMINI_API_KEY_3
        sync: false
      - key: JARVIS_GEMINI_API_KEY_4
        sync: false
      - key: JARVIS_GEMINI_API_KEY_5
        sync: false
      - key: JARVIS_GEMINI_API_KEY_6
        sync: false
      - key: JARVIS_GEMINI_API_KEY_7
        sync: false
      - key: JARVIS_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: JARVIS_GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: JARVIS_GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: JARVIS_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: JARVIS_GITHUB_TOKEN
        sync: false
      - key: JARVIS_GOOGLE_DRIVE_ACCESS_TOKEN
        sync: false
      - key: JARVIS_TELEGRAM_BOT_TOKEN
        sync: false
      - key: JARVIS_TELEGRAM_ALLOWED_CHAT_IDS
        sync: false
      - key: JARVIS_ELEVENLABS_API_KEY
        sync: false
