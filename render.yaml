services:
  - type: web
    name: jarvis-assistant
    runtime: node
    plan: free
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JARVIS_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_CHAT_ENABLED
        sync: false
      - key: GEMINI_WEB_RESEARCH_ENABLED
        value: "false"
      - key: JARVIS_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: JARVIS_GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: JARVIS_GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: JARVIS_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: JARVIS_GITHUB_TOKEN
        sync: false
      - key: JARVIS_GOOGLE_DRIVE_ACCESS_TOKEN
        sync: false
      - key: JARVIS_TELEGRAM_BOT_TOKEN
        sync: false
      - key: JARVIS_TELEGRAM_ALLOWED_CHAT_IDS
        sync: false
      - key: JARVIS_ELEVENLABS_API_KEY
        sync: false
