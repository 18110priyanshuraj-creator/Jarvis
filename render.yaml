services:
  - type: web
    name: jarvis-assistant
    runtime: node
    plan: free
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JARVIS_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_CHAT_ENABLED
        sync: false
      - key: GEMINI_WEB_RESEARCH_ENABLED
        value: "false"
