services:
  - type: web
    name: jarvis-assistant
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JARVIS_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: OLLAMA_BASE_URL
        sync: false
      - key: JARVIS_MODEL
        value: qwen2.5:7b
